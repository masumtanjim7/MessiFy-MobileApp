version: '3.8'

services:
  # 1. Database: PostgreSQL for Django
  postgres:
    image: postgres:16-alpine
    container_name: messify_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: messify_db
      POSTGRES_USER: messify_user
      POSTGRES_PASSWORD: messify_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. In-memory Cache & Task Queue: Redis
  redis:
    image: redis:7-alpine
    container_name: messify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # 3. Automation Tool: n8n
  n8n:
    image: n8nio/n8n:latest
    container_name: messify_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      - ./n8n_data:/home/node/.n8n

volumes:
  postgres_data: